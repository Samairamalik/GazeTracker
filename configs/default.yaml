landmarks:
  model_path: models/face_landmarker.task
  num_faces: 1
  eye_open_min: 0.15   # lid distance / eye width; below this an eye counts as closed
camera:
  index: 0
pose:
  max_yaw_deg: 30      # |yaw| above this -> valid=False
  max_pitch_deg: 25
calib:
  n_points: 9          # 9 (3x3) or 16 (4x4); override: make app N_POINTS=16
  features: iris_pose  # iris (uR,vR,uL,vL), iris_pose (+ yaw, pitch) or iris_open (+ eye openness); override: make app FEATURES=iris_open
  inset: 0.08          # fraction of viewport w/h
  order_seed: null     # dot order shuffle seed; null = new seed per calibration (logged in calib_result)
  dot_s: 1.5
  skip_start_s: 0.4    # saccade latency
  skip_end_s: 0.1
  min_samples: 5       # valid frames needed per dot
  degrees: [1, 2]      # affine, quadratic
  alphas_log10: [-4, 3, 15]   # logspace(start, stop, num)
  poly2_margin: 0.10   # quadratic must beat affine LOO RMS by this fraction
filter:
  kind: one_euro       # one_euro or moving_average
  min_cutoff_hz: 1.0
  beta: 0.005          # 1/px
  d_cutoff_hz: 1.0
  ma_n: 5
  max_hold_s: 0.15
app:
  host: 127.0.0.1
  port: 8000
  source: camera       # camera or synthetic (synthetic = test only, never an accuracy result)
  synthetic_noise_px: 20
reading:
  text: alice_excerpts # file in src/gazeread/app/static/texts/<text>.txt, paragraphs separated by blank lines
  font_px: 30
  line_height: 2.2     # line pitch = font_px * line_height = 66 px
  column_ch: 60        # column width in characters
  para_gap_lines: 1.0  # extra space between paragraphs, in line pitches
  margin_y_px: 60
  show_cursor: false   # a visible gaze cursor changes how people read
analysis:
  mapping_mode: soft   # soft (Gaussian in y, sigma = calibration rms_y) or hard (nearest line)
  mapping_source: fixations  # primary view: fixations (I-DT) or samples; both are always in the result JSON
  idt_k: 1.25          # I-DT dispersion threshold = idt_k * sigma_px
  min_fix_s: 0.1
  merge_gap_s: 0.075
  hard_tol_lines: 1.0  # hard mode: nearest line only if its centre is within this many line pitches
  max_sample_dt_s: 0.1 # samples mode: cap on time credited to one sample
gaze:
  backend: landmark    # primary (cursor): landmark (Method A) or l2cs (Method B); override: make app BACKEND=l2cs
  compare: false       # run both backends and calibrate A, B, B+pose on the same dots; override: make app COMPARE=1
l2cs:
  weights: models/l2cs_gaze360_resnet50.safetensors   # official Gaze360 weights via Py-Feat (see CITATIONS.md); not MPIIGaze (trained on the M5 test people)
  features: gaze       # gaze (yaw, pitch) = "B" or gaze_pose (+ MediaPipe head yaw, pitch) = "B+pose", when l2cs is primary
  crop_scale: 1.2      # square face box = 1.2 x landmark extent; fixed before any measurement
  device: auto         # auto = mps if available, else cpu
